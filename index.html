<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inkwell is a blogging platform where you can read, write and publish articles.">
  <title>Inkwell</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✒️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('inkwell:theme'); } catch (error) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = (saved ? saved === 'dark' : prefersDark) ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/post.css">
  <link rel="stylesheet" href="css/reading.css">
  <link rel="stylesheet" href="css/comments.css">
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="Inkwell home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg>
        <span>Inkwell</span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/dashboard" data-nav="dashboard">My posts</a>
        <a href="#/write" data-nav="write" class="nav-write">Write</a>
      </nav>

      <div class="header-actions">
        <a class="btn btn-primary btn-sm write-link" href="#/write">Write</a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="profile-btn" id="profile-btn" aria-label="Change display name" title="Change display name">
          <span class="avatar" id="profile-avatar">?</span>
        </button>
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1">
    <p class="loading">Loading Inkwell...</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><strong>Inkwell</strong> &middot; A blogging platform built with vanilla JavaScript. Your posts are saved in this browser.</p>
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/">Home</a>
        <a href="#/dashboard">My posts</a>
        <a href="#/write">Write</a>
      </nav>
    </div>
  </footer>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>Inkwell needs JavaScript to run. Please enable it in your browser.</noscript>
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/home.js"></script>
  <script src="js/post.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
